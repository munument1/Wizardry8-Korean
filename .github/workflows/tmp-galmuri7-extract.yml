name: Temporary Galmuri7 Extract

on:
  push:
    branches:
      - tmp/galmuri7-font-extract
    paths-ignore:
      - tmp/Galmuri7_required_glyphs.txt

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/galmuri7-font-extract

      - name: Download official Galmuri7 BDF
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/quiple/galmuri/main/dist/Galmuri7.bdf \
            --output Galmuri7.bdf

      - name: Extract required Korean bitmaps
        env:
          REQUIRED_CP_ZLIB_B64: 
        run: |
          python3 - <<'PY'
          import base64, os, re, struct, zlib
          from pathlib import Path

          raw = zlib.decompress(base64.b64decode(os.environ['REQUIRED_CP_ZLIB_B64']))
          required = {struct.unpack_from('<H', raw, i)[0] for i in range(0, len(raw), 2)}
          records = {}
          current = None
          bitmap = False

          for line in Path('Galmuri7.bdf').read_text(encoding='utf-8').splitlines():
              if line.startswith('STARTCHAR '):
                  current = {'cp': None, 'bbx': None, 'dwidth': None, 'rows': []}
                  bitmap = False
              elif current is not None and line.startswith('ENCODING '):
                  current['cp'] = int(line.split()[1])
              elif current is not None and line.startswith('DWIDTH '):
                  current['dwidth'] = tuple(map(int, line.split()[1:3]))
              elif current is not None and line.startswith('BBX '):
                  current['bbx'] = tuple(map(int, line.split()[1:5]))
              elif current is not None and line == 'BITMAP':
                  bitmap = True
              elif current is not None and line == 'ENDCHAR':
                  cp = current['cp']
                  if cp in required:
                      if not current['bbx'] or not current['rows']:
                          raise RuntimeError(f'incomplete glyph U+{cp:04X}')
                      records[cp] = current
                  current = None
                  bitmap = False
              elif current is not None and bitmap:
                  current['rows'].append(line.strip().upper())

          missing = sorted(required - records.keys())
          if missing:
              raise RuntimeError(f'missing {len(missing)} glyphs, first U+{missing[0]:04X}')

          out = Path('tmp/Galmuri7_required_glyphs.txt')
          out.parent.mkdir(parents=True, exist_ok=True)
          with out.open('w', encoding='ascii', newline='\n') as f:
              f.write('# Galmuri7 required Hangul glyphs; source quiple/galmuri 2.40.3\n')
              f.write('# format: CODEPOINT|BBX(w,h,x,y)|DWIDTH(x,y)|BITMAP_ROWS_HEX\n')
              for cp in sorted(records):
                  r = records[cp]
                  f.write(f"{cp:04X}|{','.join(map(str,r['bbx']))}|{','.join(map(str,r['dwidth']))}|{','.join(r['rows'])}\n")
          print(f'wrote {len(records)} glyphs to {out}')
          PY

      - name: Commit compact glyph table
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/Galmuri7_required_glyphs.txt
          git commit -m 'chore: generate temporary Galmuri7 glyph table [skip ci]' || exit 0
          git push origin HEAD:tmp/galmuri7-font-extract
